services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ip.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme:/var/www/acme:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      assistant:
        condition: service_healthy
