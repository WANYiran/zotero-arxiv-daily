server {
    listen 80 default_server;
    server_name _;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/paper-assistant-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper-assistant-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://assistant:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
