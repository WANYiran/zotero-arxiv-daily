services:
  assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - assistant-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  bridge:
    profiles: [wechat]
    build:
      context: ../bridge
    restart: unless-stopped
    env_file: .env
    environment:
      ASSISTANT_URL: http://assistant:8080
      WECHATY_NAME: /data/paper-assistant
    volumes:
      - wechat-session:/data
    depends_on:
      assistant:
        condition: service_healthy
  weixin:
    profiles: [weixin]
    build:
      context: ../bridge
      dockerfile: Dockerfile.weixin
    restart: unless-stopped
    env_file: .env
    environment:
      ASSISTANT_URL: http://assistant:8080
    volumes:
      - weixin-session:/data
    depends_on:
      assistant:
        condition: service_healthy

volumes:
  assistant-data:
  wechat-session:
  weixin-session:
