name: CI
on:
  workflow_dispatch:
    inputs:
      verify_zotero:
        description: Check configured Zotero secrets without printing library content
        type: boolean
        default: false
      generate_digest:
        description: Generate and store a real HCI/AI digest without sending messages
        type: boolean
        default: false
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  generate-digest:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_digest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: paper-assistant-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Generate and store a digest
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ASSISTANT_URL: ${{ secrets.ASSISTANT_URL }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
        run: uv run src/zotero_arxiv_daily/main.py --config-name hci_assistant assistant.deliver=false
  zotero-check:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_zotero
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify read-only Zotero access
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: python3 scripts/check_zotero.py
      - name: Verify deployed HTTPS service when configured
        env:
          ASSISTANT_URL: ${{ secrets.ASSISTANT_URL }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
        run: python3 scripts/check_assistant.py
  wechat-bridge:
    if: ${{ !inputs.verify_zotero && !inputs.generate_digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bridge
        working-directory: bridge
        run: |
          npm ci --ignore-scripts
          npm test
          node --input-type=module -e 'import { WechatyBuilder } from "wechaty"; WechatyBuilder.build({puppet:"wechaty-puppet-service"});'
  pytest:
    if: ${{ !inputs.verify_zotero && !inputs.generate_digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Run Pytest
        run: |
          uv run pytest -m "" --cov=src/zotero_arxiv_daily --cov-report=term-missing
