name: HCI AI paper assistant
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
concurrency:
  group: paper-assistant-daily
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ASSISTANT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Generate and publish digest
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ASSISTANT_URL: ${{ secrets.ASSISTANT_URL }}
          ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_TOKEN }}
        run: uv run src/zotero_arxiv_daily/main.py --config-name hci_assistant
